pre-commit:
  parallel: false
  commands:
    biome:
      glob: "*.{js,ts,cjs,mjs,cts,mts,jsx,tsx,json,jsonc,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    eslint:
      glob: "src/**.{js,jsx,ts,tsx}"
      run: bunx eslint --max-warnings=0 --no-warn-ignored {staged_files}
